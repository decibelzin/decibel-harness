[package]
name = "decibel-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

# Leaf crate: the provider-neutral message and streaming vocabulary spoken by
# the loop, the session log, and every plugin. Adapters alone translate a
# provider's wire format into these types. No I/O and no runtime here — the
# concrete OpenRouter adapter lives in `decibel-openrouter`.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
futures-core = "0.3"
