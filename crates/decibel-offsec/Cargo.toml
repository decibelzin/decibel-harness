[package]
name = "decibel-offsec"
version.workspace = true
edition.workspace = true
license.workspace = true

# The offensive toolkit: the model-facing tools that make Decibel a red-team
# agent. Every tool implements `decibel_tools::Tool` (canonical value + pure
# render), so a UI replays a tool card from the log and a future Code Mode
# dispatches over the value. No guard rails: the shell and filesystem tools run
# with the user's full authority — the one non-negotiable is scrubbing secret
# env vars from spawned processes so a key never leaks into model context.

[dependencies]
decibel-tools = { path = "../decibel-tools" }
decibel-llm = { path = "../decibel-llm" }
decibel-executor = { path = "../decibel-executor" }
decibel-store = { path = "../decibel-store" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "rt", "macros", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
walkdir = "2"
globset = "0.4"
regex = "1"
roxmltree = "0.20"
# Pure web/auth analyzers ported from Decepticon's tools/web (jwt/oauth/cookie/graphql).
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
# Native recon (arsenal): TLS inspection via rustls (ring backend — no OpenSSL) + cert parsing.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.16"

[target.'cfg(unix)'.dependencies]
# Kill the whole process group on timeout/cancel so a launched tool (nmap, etc.)
# does not orphan past the shell wrapper.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"
tempfile = "3"
# Loads the self-signed cert/key in arsenal/tls.rs tests.
rustls-pemfile = "2"
# The live red-team demo wires the toolkit into the agent loop and OpenRouter.
decibel-agent = { path = "../decibel-agent" }
decibel-openrouter = { path = "../decibel-openrouter" }
decibel-core = { path = "../decibel-core" }
dotenvy = "0.15"
